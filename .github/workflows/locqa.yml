name: Localization QA

on:
  pull_request:
    paths:
      - "**/*.arb"
      - "glossary.csv"

permissions:
  contents: read
  pull-requests: write

jobs:
  locqa:
    runs-on: ubuntu-latest
    env:
      L10N_DIR: lib/l10n            # where intl_*.arb live in the game repo
      TEMPLATE: intl_ru.arb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locqa
        run: pip install ./tools/locqa || pip install git+https://github.com/${{ github.repository_owner }}/locqa.git
      - name: Changed ARB files
        id: changed
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          files=$(git diff --name-only "$base" HEAD -- "$L10N_DIR"/*.arb | grep -v "/$TEMPLATE$" || true)
          # template changed -> re-check every translation
          if git diff --name-only "$base" HEAD | grep -q "/$TEMPLATE$"; then files=$(ls "$L10N_DIR"/intl_*.arb | grep -v "/$TEMPLATE$"); fi
          echo "files<<EOF" >> "$GITHUB_OUTPUT"; echo "$files" >> "$GITHUB_OUTPUT"; echo "EOF" >> "$GITHUB_OUTPUT"
      - name: Run checks
        id: run
        run: |
          mkdir -p locqa-out
          status=0
          echo "## Localization QA" >> "$GITHUB_STEP_SUMMARY"
          for f in ${{ steps.changed.outputs.files }}; do
            name=$(basename "$f" .arb)
            locqa validate --template "$L10N_DIR/$TEMPLATE" --target "$f" || status=1
            locqa check --source "$L10N_DIR/$TEMPLATE" --target "$f" --glossary glossary.csv \
                        --out "locqa-out/$name.report.json" --fail-on high 2> "locqa-out/$name.txt" || status=1
            { echo "### $name"; echo '```'; cat "locqa-out/$name.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
          exit $status
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locqa-reports
          path: locqa-out/
